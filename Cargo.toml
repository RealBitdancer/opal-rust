[package]
name = "opal"
version = "2.0.2-2"
edition = "2024"
rust-version = "1.97"
description = "Rust binding for opal, the OPL2/OPL3 (YMF262) FM synthesis emulator"
license = "MIT"
repository = "https://github.com/RealBitdancer/opal-rust"
homepage = "https://github.com/RealBitdancer/opal-rust"
documentation = "https://docs.rs/opal"
readme = "README.md"
keywords = ["opl3", "opl2", "fm", "synthesis", "adlib"]
categories = ["multimedia::audio", "api-bindings", "emulators"]
include = [
    "src/**/*",
    "vendor/**/*",
    "examples/**/*",
    "build.rs",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]
links = "opal"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "opal"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
manual_memcpy = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
